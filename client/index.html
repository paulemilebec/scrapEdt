<!DOCTYPE html>
<html lang="fr">
<head>
    <script defer src="https://stats.paulemilebecquart.ovh/script.js" data-website-id="ec940ced-fa3b-467c-b579-a424605dca51"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Calendrier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <section class="copy-card" aria-labelledby="copy-title">
            <p class="kicker">Synchronisation calendrier</p>
            <h1 id="copy-title">Ajoutez votre emploi du temps en un clic</h1>
            <p class="lead">
                Copiez le lien ICS ci-dessous, puis importez-le dans Outlook & Google Calendar & Apple Calendar ou votre application de calendrier favorite.
            </p>
            <div class="url-container">
                <input type="text" id="calendarUrl" readonly value="https://scrapedt.paulemilebecquart.ovh/api_data/emploisDuTemps.ics">
                <button id="copyButton" onclick="copyToClipboard()">Copier le lien</button>
            </div>
            <p id="copyStatus" class="copy-status" aria-live="polite"></p>
        </section>
    </main>
    
    <a href="https://github.com/paulemilebec/scrapEdt" target="_blank" class="github-link">
        <svg height="32" width="32" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
    </a>

    <script>
        function copyToClipboard() {
            const copyText = document.getElementById("calendarUrl");
            const copyStatus = document.getElementById("copyStatus");
            const copyButton = document.getElementById("copyButton");
            navigator.clipboard.writeText(copyText.value).then(() => {
                copyStatus.textContent = "Lien copié dans le presse-papiers.";
                copyButton.textContent = "Copié";
                setTimeout(() => {
                    copyButton.textContent = "Copier le lien";
                }, 1400);
            }).catch(() => {
                copyStatus.textContent = "Impossible de copier automatiquement. Sélectionnez le lien et copiez-le manuellement.";
            });
        }
    </script>
</body>
<style>
    :root {
  --bg-top: #0f2f42;
  --bg-bottom: #184b5a;
  --card-bg: rgba(250, 252, 250, 0.96);
  --text-main: #11202b;
  --text-soft: #30424d;
  --line: #b8c8ce;
  --accent: #ea6f3c;
  --accent-strong: #c9562a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text-main);
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 18% 18%, rgba(255, 209, 179, 0.25) 0%, transparent 42%),
    radial-gradient(circle at 88% 84%, rgba(118, 205, 196, 0.24) 0%, transparent 38%),
    linear-gradient(150deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 34px;
}

.page-shell {
  width: min(1180px, 100%);
}

.copy-card {
  background: var(--card-bg);
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 22px;
  box-shadow: 0 28px 70px rgba(3, 18, 27, 0.38);
  padding: 38px;
}

.kicker {
  margin: 0;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--accent-strong);
  font-weight: 700;
}

h1 {
  margin: 10px 0 0;
  font-size: clamp(1.7rem, 2.8vw, 2.4rem);
  line-height: 1.15;
}

.lead {
  margin: 14px 0 20px;
  color: var(--text-soft);
  max-width: 70ch;
}

.outlook-link-wrap {
  margin: 0 0 20px;
  color: var(--text-soft);
  font-weight: 600;
}

.outlook-link-wrap a {
  color: var(--accent-strong);
}

.url-container {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  width: 100%;
}

#calendarUrl {
  width: 100%;
  min-width: 0;
  padding: 17px 20px;
  font-size: clamp(1.02rem, 2vw, 1.18rem);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-family: "Consolas", "Courier New", monospace;
  color: #06212f;
  background: #ffffff;
}

button {
  border: none;
  border-radius: 12px;
  padding: 0 30px;
  font-size: 1rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
  cursor: pointer;
  transition: transform 0.2s ease, filter 0.2s ease;
}

button:hover {
  transform: translateY(-1px);
  filter: brightness(1.02);
}

.copy-status {
  min-height: 1.25rem;
  margin: 12px 2px 0;
  color: #1f5a44;
  font-size: 0.93rem;
}

.github-link {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: rgba(3, 16, 25, 0.35);
  color: #f6fcff;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.88;
  transition: transform 0.2s ease, opacity 0.2s ease;
  backdrop-filter: blur(8px);
}

.github-link:hover {
  opacity: 1;
  transform: scale(1.08);
}

@media (max-width: 900px) {
  .copy-card {
    padding: 26px;
  }

  .url-container {
    grid-template-columns: 1fr;
  }

  button {
    min-height: 52px;
  }
}

@media (max-width: 540px) {
  body {
    padding: 16px;
  }

  .copy-card {
    border-radius: 16px;
    padding: 18px;
  }

  #calendarUrl {
    padding: 14px 14px;
    font-size: 0.97rem;
  }
}
</style>
</html>
